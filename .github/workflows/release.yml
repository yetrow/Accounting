name: Bill signed APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore private signing material
        env:
          BILL_KEYSTORE_BASE64: ${{ secrets.BILL_KEYSTORE_BASE64 }}
        run: |
          test -n "$BILL_KEYSTORE_BASE64"
          printf '%s' "$BILL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bill.jks"
          chmod 600 "$RUNNER_TEMP/bill.jks"
      - run: npm run android:release
        env:
          BILL_KEYSTORE: ${{ runner.temp }}/bill.jks
          BILL_STORE_PASSWORD: ${{ secrets.BILL_STORE_PASSWORD }}
          BILL_KEY_ALIAS: ${{ secrets.BILL_KEY_ALIAS }}
          BILL_KEY_PASSWORD: ${{ secrets.BILL_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Bill-3.0.0-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
