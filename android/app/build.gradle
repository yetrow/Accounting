plugins { id 'com.android.application' }
android {
    namespace 'com.jizhang.repaired'
    compileSdk 35
    defaultConfig { applicationId 'com.jizhang.repaired'; minSdk 24; targetSdk 35; versionCode 202; versionName '2.0.2' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets { main { assets.srcDirs = ['../generated-assets'] } }
}
tasks.register('copyWeb', Copy) { from '../../dist'; into '../generated-assets/web' }
tasks.named('preBuild').configure { dependsOn 'copyWeb' }
